name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancela ejecuciones en curso del mismo branch cuando llega un push nuevo —
# no tiene sentido gastar minutos de CI en un commit que ya se superó.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versión de Go de TODA la CI, en un solo sitio.
  #
  # Deliberadamente NO se usa `go-version-file: go.mod`. La directiva `go` del
  # go.mod es un MÍNIMO de lenguaje, pero setup-go la interpreta como una
  # versión exacta, y Go canoniza esa directiva a la forma con parche
  # (`go 1.25.0`) — `go mod edit -go=1.25` se revierte en el siguiente
  # `go mod tidy`. El resultado era que la CI instalaba exactamente 1.25.0, de
  # agosto de 2025, e iba quedándose atrás una release tras otra: doce parches
  # de correcciones, varias de seguridad, que nunca se probaban.
  #
  # Con `1.25.x` se coge el último parche de la serie sin saltar de minor por
  # sorpresa. Al subir el mínimo en go.mod, hay que subir también este número.
  #
  # NOTA: esto NO arregla el fallo de enlazado de macOS. Se llegó a pensar que
  # sí —la imagen macos-26-arm64 es posterior a Go 1.25.0— pero el fallo se
  # reproduce igual con 1.24.0, 1.25.0 y 1.25.12. Ver el comentario de la
  # matriz de build-and-test.
  GO_VERSION: "1.25.x"

jobs:
  # Comprobaciones que no dependen del sistema operativo: se corren una vez,
  # no tres veces en la matriz.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Estos ficheros no están formateados. Ejecuta: gofmt -w ./..."
            echo "$unformatted"
            exit 1
          fi

      # Habría detectado el go.mod con dos dependencias declaradas como
      # `v0.0.0-latest`, que no es una versión válida: `go build` funcionaba
      # (nadie las importaba) pero `go mod tidy`, `go list -m all` y cualquier
      # herramienta de análisis de dependencias fallaban.
      - name: go.mod está al día
        run: go mod tidy -diff

      # La acción v9 es la primera de la serie que soporta golangci-lint v2,
      # que es lo que declara .golangci.yml (`version: "2"`). Con la v6 la
      # acción instalaba un golangci-lint v1 compilado con Go 1.24 y fallaba
      # antes de analizar nada:
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.25.0)
      #
      # La versión va fijada al minor, no a `latest`: así la CI analiza con lo
      # mismo que se ejecuta en local, y una release nueva del linter no
      # convierte un commit correcto en un fallo. El parche sí se coge solo.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      # En un producto de seguridad, no comprobar los CVE de las propias
      # dependencias es difícil de defender.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 y macos-latest a la vez, y no es redundante: macos-latest
        # apunta hoy a macos-26-arm64, donde el enlazador de Apple rechaza los
        # objetos que genera Go ("ld: unknown file type in ...o"). Ese fallo
        # NO es una regresión de este repositorio: el job de macOS no ha
        # pasado nunca, con Go 1.24.0, 1.25.0 y 1.25.12, y el rodeo
        # `-Wl,-no_fixup_chains` que hubo un tiempo tampoco lo arregló.
        #
        # macos-15 da cobertura real de macOS mientras se investiga, y
        # macos-26 se sigue ejecutando —tolerando el fallo— porque es el
        # macOS que acabarán teniendo los clientes y hay que enterarse el día
        # que se arregle.
        os: [ubuntu-latest, windows-latest, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # TEMPORAL — diagnóstico del toolchain de macOS.
      #
      # Se quita en cuanto se sepa la causa del fallo de enlazado. Está aquí
      # porque no hay forma de reproducirlo en local y la ejecución de la CI
      # es el único sitio donde se pueden leer estos datos. Cubre las
      # hipótesis en juego: un `ld` distinto del de Apple por delante en el
      # PATH, unas Command Line Tools mal seleccionadas, o un SDK ausente.
      - name: diagnóstico del toolchain (temporal)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "::group::qué ld y qué clang se están usando"
          which -a ld || true
          ld -v 2>&1 | head -5 || true
          which -a clang || true
          clang --version || true
          echo "::endgroup::"

          echo "::group::Xcode y SDK"
          xcode-select -p || true
          xcrun --show-sdk-path || true
          xcrun --show-sdk-version || true
          ls -1 /Library/Developer/CommandLineTools/SDKs/ 2>/dev/null || true
          ls -1 /Applications | grep -i xcode || true
          echo "::endgroup::"

          echo "::group::PATH"
          echo "$PATH" | tr ':' '\n'
          echo "::endgroup::"

          echo "::group::go env"
          go env CC CXX CGO_ENABLED GOOS GOARCH GOROOT
          echo "::endgroup::"

          echo "::group::¿falla también un programa Go mínimo?"
          # Si esto falla, el problema no tiene nada que ver con este
          # repositorio: es la imagen. Si pasa, el problema está en alguna
          # dependencia concreta.
          mkdir -p "$RUNNER_TEMP/minimal" && cd "$RUNNER_TEMP/minimal"
          printf 'package main\n\nfunc main() {}\n' > main.go
          go mod init minimal >/dev/null
          echo "-- con cgo (por defecto en nativo):"
          go build -o /dev/null . && echo "   OK" || echo "   FALLA"
          echo "-- sin cgo:"
          CGO_ENABLED=0 go build -o /dev/null . && echo "   OK" || echo "   FALLA"
          echo "::endgroup::"

          echo "::group::¿y el agente sin cgo?"
          cd "$GITHUB_WORKSPACE"
          CGO_ENABLED=0 go build -o /dev/null ./cmd/hygeia-agent && echo "   OK" || echo "   FALLA"
          echo "::endgroup::"

      # Sin CGO_LDFLAGS a mano. Antes se pasaba `-Wl,-no_fixup_chains` en
      # macOS como rodeo para el enlazador de Xcode 16.3, pero nunca llegó a
      # arreglar nada —el job siguió rojo— y de paso pisaba el `-O2 -g` que
      # setup-go pone por defecto.
      - name: go build (los dos binarios y todos los paquetes)
        run: go build ./...

      # -race necesita cgo. ubuntu-latest (gcc) y macos-latest (clang, ya
      # hace falta para compilar hygeia-tray vía cgo en darwin) lo tienen de
      # fábrica; windows-latest no trae un toolchain de C fiable, así que ahí
      # se corre sin -race en vez de arriesgar un CI intermitente.
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...
