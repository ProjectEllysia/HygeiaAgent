name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancela ejecuciones en curso del mismo branch cuando llega un push nuevo —
# no tiene sentido gastar minutos de CI en un commit que ya se superó.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versión de Go de TODA la CI, en un solo sitio.
  #
  # Deliberadamente NO se usa `go-version-file: go.mod`. La directiva `go` del
  # go.mod es un MÍNIMO de lenguaje, pero setup-go la interpreta como una
  # versión exacta, y Go canoniza esa directiva a la forma con parche
  # (`go 1.25.0`) — `go mod edit -go=1.25` se revierte en el siguiente
  # `go mod tidy`. El resultado era que la CI instalaba exactamente 1.25.0,
  # de agosto de 2025, e iba quedándose atrás una release tras otra.
  #
  # Eso fue lo que rompió el build de macOS: la imagen macos-latest pasó a ser
  # macos-26-arm64 (macOS Tahoe), cuyo toolchain es POSTERIOR a Go 1.25.0, y
  # el enlazador de Apple no reconocía los objetos que generaba aquel Go
  # ("ld: unknown file type in ...o"). Linux y Windows no se enteraban porque
  # no usan el enlazador de Apple.
  #
  # Con `1.25.x` se coge el último parche de la serie (correcciones de
  # seguridad y de compatibilidad de toolchain) sin saltar de minor por
  # sorpresa. Al subir el mínimo en go.mod, hay que subir también este número.
  GO_VERSION: "1.25.x"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go vet
        run: go vet ./...

      # Sin CGO_LDFLAGS a mano. Antes se pasaba `-Wl,-no_fixup_chains` en
      # macOS como rodeo para el enlazador de Xcode 16.3, pero (a) ese rodeo
      # dejó de funcionar en macos-26-arm64, y (b) sobreescribir CGO_LDFLAGS
      # pisa el `-O2 -g` que setup-go pone por defecto. La causa real era la
      # versión de Go congelada; ver el comentario de GO_VERSION arriba.
      - name: go build (los dos binarios y todos los paquetes)
        run: go build ./...

      # -race necesita cgo. ubuntu-latest (gcc) y macos-latest (clang, ya
      # hace falta para compilar hygeia-tray vía cgo en darwin) lo tienen de
      # fábrica; windows-latest no trae un toolchain de C fiable, así que ahí
      # se corre sin -race en vez de arriesgar un CI intermitente.
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...
