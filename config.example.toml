# Ejemplo de configuración del agente Hygeia.
#
# Ubicación real cuando corre como servicio (§6):
#   Windows  C:\ProgramData\Hygeia\config.toml
#   Linux    /etc/hygeia/config.toml
#   macOS    /Library/Application Support/Hygeia/config.toml
#
# Override de la ruta con HYGEIA_CONFIG, y del directorio de estado completo
# (config + buffer + log) con HYGEIA_DATA_DIR.
#
# Cualquier campo puede sobreescribirse con variables de entorno:
#   HYGEIA_SERVER_URL, HYGEIA_AGENT_KEY, HYGEIA_INTERVAL_SEC, HYGEIA_BUFFER_PATH,
#   HYGEIA_INVENTORY_INTERVAL_SEC, HYGEIA_BUFFER_MAX_ITEMS,
#   HYGEIA_INVENTORY_MAX_ITEMS

serverUrl   = "https://ellysia.tu-dominio/hygeia"

# agentKey es OPCIONAL en el fichero. Si falta, el agente arranca igualmente
# en estado "sin configurar": no recolecta ni envía nada, y espera a que el
# companion de bandeja (hygeia-tray) le pase la clave (§11.3). Así se puede
# desplegar el binario antes de dar de alta el activo.
#
# Al guardarla por esa vía, el agente reescribe este fichero con permisos
# restringidos (0600 en Unix, DACL solo para SYSTEM/Administradores/dueño en
# Windows) y SIN los comentarios de esta plantilla.
# agentKey  = "PEGA-AQUI-LA-CLAVE-EMITIDA-POR-EL-BACKEND"

intervalSec = 15
collectors  = ["cpu", "memory", "disk", "network", "processes"]

# Cadencia del escaneo de software instalado, independiente de intervalSec:
# el inventario cambia poco y escanearlo es más lento que el resto de
# colectores, así que no viaja en cada heartbeat (se adjunta una sola vez
# tras cada escaneo). Rango aceptado: 300s (5min) a 604800s (7 días).
# inventoryIntervalSec = 21600

# Máximo de aplicaciones que se reportan por escaneo. Debe quedar por DEBAJO
# del tope del backend (features.hygeia.limits.maxInventoryItems, 2000 por
# defecto): pasarse de ahí no cuesta el inventario, cuesta el heartbeat
# entero, porque el backend lo rechaza con un error de validación. Si el
# equipo tiene más aplicaciones, se ordenan por nombre y se envían las
# primeras, dejando aviso en el log.
# inventoryMaxItems = 1500

# Por defecto, buffer.jsonl dentro del directorio de estado. Descoméntalo
# solo si necesitas otra ubicación.
# bufferPath = "C:/ProgramData/Hygeia/buffer.jsonl"

# Cuántos heartbeats aplazados retiene el buffer en disco mientras el backend
# no responde. Por defecto 1000: unas 4 horas con intervalSec = 15.
#
# El techo útil no lo pone este número, sino la ventana de backfill del
# backend (features.hygeia.limits.maxBackfillSec, 24 h por defecto): un
# payload más viejo que eso se rechaza al drenar, por muy bien guardado que
# estuviera. Subirlo por encima de esa ventana solo gasta disco.
# bufferMaxItems = 1000
